<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANEE Cockpit | NeuroMarket Impact Engine</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #111827;
            --accent: #00ffd5;
            --accent-dim: #00ffd540;
            --text: #e5e7eb;
            --text-dim: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', 'SF Pro', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--accent-dim);
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
        }
        
        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--success);
            color: #000;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid #1f2937;
        }
        
        .card h2 {
            font-size: 0.875rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.75rem;
        }
        
        .metric-label {
            color: var(--text-dim);
            font-size: 0.875rem;
        }
        
        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }
        
        .metric-value.positive { color: var(--success); }
        .metric-value.negative { color: var(--danger); }
        
        .progress-bar {
            height: 8px;
            background: #1f2937;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #00ff88);
            transition: width 0.3s ease;
        }
        
        .schedule-ribbon {
            display: flex;
            height: 60px;
            gap: 2px;
            margin-top: 1rem;
        }
        
        .schedule-bar {
            flex: 1;
            background: var(--accent-dim);
            border-radius: 2px;
            position: relative;
        }
        
        .schedule-bar .planned {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--accent);
            opacity: 0.5;
        }
        
        .schedule-bar .executed {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--success);
        }
        
        .ws-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--danger);
            animation: pulse 1.5s infinite;
        }
        
        .ws-indicator.connected {
            background: var(--success);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .control-panel {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button.primary {
            background: var(--accent);
            color: #000;
        }
        
        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-dim);
        }
        
        button.secondary {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        
        .log {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            background: #000;
            padding: 1rem;
            border-radius: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            color: var(--text-dim);
        }
        
        .log .entry { margin-bottom: 0.25rem; }
        .log .timestamp { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ANEE Cockpit</h1>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="ws-indicator" id="wsIndicator"></div>
                <span class="status-badge" id="status">IDLE</span>
            </div>
        </header>
        
        <div class="grid">
            <!-- Live Metrics -->
            <div class="card">
                <h2>Execution Progress</h2>
                <div class="metric">
                    <span class="metric-label">Shares Executed</span>
                    <span class="metric-value" id="cumExecuted">0</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Target Shares</span>
                    <span class="metric-value" id="totalShares">0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
            
            <!-- Cost Metrics -->
            <div class="card">
                <h2>Implementation Shortfall</h2>
                <div class="metric">
                    <span class="metric-label">Current IS (bps)</span>
                    <span class="metric-value" id="isBps">0.00</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Deviation from Plan</span>
                    <span class="metric-value" id="deviation">0.0%</span>
                </div>
            </div>
            
            <!-- Controller State -->
            <div class="card">
                <h2>Controller State</h2>
                <div class="metric">
                    <span class="metric-label">Aggression (α)</span>
                    <span class="metric-value" id="alpha">1.00</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Trust Region Clipped</span>
                    <span class="metric-value" id="trClipped">No</span>
                </div>
            </div>
            
            <!-- Schedule Ribbon -->
            <div class="card" style="grid-column: span 2;">
                <h2>Schedule: Planned vs Executed</h2>
                <div class="schedule-ribbon" id="scheduleRibbon">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </div>
        
        <div class="control-panel">
            <button class="primary" onclick="connectWS()">Connect to Telemetry</button>
            <button class="secondary" onclick="runDemo()">Run Demo Order</button>
        </div>
        
        <div class="card" style="margin-top: 2rem;">
            <h2>Event Log</h2>
            <div class="log" id="log"></div>
        </div>
    </div>
    
    <script>
        let ws = null;
        
        function log(msg) {
            const logEl = document.getElementById('log');
            const ts = new Date().toLocaleTimeString();
            logEl.innerHTML += `<div class="entry"><span class="timestamp">[${ts}]</span> ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function connectWS() {
            const wsUrl = 'ws://localhost:8000/telemetry/ws/execution';
            log(`Connecting to ${wsUrl}...`);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                log('Connected!');
                document.getElementById('wsIndicator').classList.add('connected');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateUI(data);
            };
            
            ws.onclose = () => {
                log('Disconnected.');
                document.getElementById('wsIndicator').classList.remove('connected');
            };
            
            ws.onerror = (e) => {
                log('WebSocket Error: ' + e.message);
            };
        }
        
        function updateUI(data) {
            document.getElementById('cumExecuted').textContent = Math.round(data.cum_executed);
            document.getElementById('totalShares').textContent = Math.round(data.total_shares || 10000);
            
            const progress = (data.cum_executed / (data.total_shares || 10000)) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            document.getElementById('alpha').textContent = data.alpha?.toFixed(2) || '1.00';
            document.getElementById('deviation').textContent = ((data.deviation_pct || 0) * 100).toFixed(2) + '%';
            document.getElementById('trClipped').textContent = data.trust_region_clipped ? 'Yes' : 'No';
            
            log(`t=${data.t} | α=${data.alpha?.toFixed(2)} | exec=${data.q_exec?.toFixed(0)}`);
        }
        
        async function runDemo() {
            log('Running demo order via API...');
            try {
                const resp = await fetch('http://localhost:8000/execution/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ticker: 'SPY',
                        size_shares: 10000,
                        start_time: '2025-12-01 10:00:00',
                        end_time: '2025-12-01 11:00:00',
                        date: '2025-12-01'
                    })
                });
                const data = await resp.json();
                log(`Demo Result: IS=${data.implementation_shortfall_bps?.toFixed(2)} bps`);
                document.getElementById('isBps').textContent = data.implementation_shortfall_bps?.toFixed(2) || '0.00';
            } catch (e) {
                log('Error: ' + e.message);
            }
        }
    </script>
</body>
</html>
